<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="10" viewBox="0 0 1000 10" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="ruleBase" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="12%" stop-color="#2dd4bf" stop-opacity="0.55"/>
      <stop offset="88%" stop-color="#2dd4bf" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ruleSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5eead4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="4.25" width="1000" height="1.5" rx="0.75" fill="url(#ruleBase)"/>

  <rect x="-220" y="3.75" width="220" height="2.5" rx="1.25" fill="url(#ruleSheen)">
    <animate attributeName="x" from="-220" to="1000" dur="5.5s" repeatCount="indefinite"/>
  </rect>
</svg>
