<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="92" viewBox="0 0 1000 92" role="img" aria-label="05 — ACTIVITY">
  <title>05 — ACTIVITY</title>
  <defs>
    <linearGradient id="bg-activity-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0b1f26"/>
      <stop offset="100%" stop-color="#050b12"/>
    </linearGradient>
    <linearGradient id="sheen-activity-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5eead4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots-activity-dark" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#2dd4bf" fill-opacity="0.10"/>
    </pattern>
    <clipPath id="frame-activity-dark"><rect width="1000" height="92" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#frame-activity-dark)">
    <rect width="1000" height="92" fill="url(#bg-activity-dark)"/>
    <rect width="1000" height="92" fill="url(#dots-activity-dark)"/>

    <rect x="-200" y="0" width="200" height="92" fill="url(#sheen-activity-dark)">
      <animate attributeName="x" from="-200" to="1000" dur="7s" repeatCount="indefinite"/>
    </rect>

    <rect x="0" y="0" width="4" height="92" fill="#2dd4bf"/>

    <text x="30" y="64" fill="#2dd4bf" fill-opacity="0.18" font-size="44" font-weight="700"
          font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">05</text>

    <text x="100" y="55" fill="#eaf6f4" font-size="21" font-weight="700" letter-spacing="3.4"
          font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">ACTIVITY</text>

    <text x="101" y="72" fill="#6f9aa3" font-size="11" letter-spacing="0.6"
          font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">commits, languages, and cadence</text>

    <g fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="832,64 852,52 868,58 884,34 900,46 916,28 934,40 952,24" stroke-dasharray="320" stroke-dashoffset="320" opacity="0.85">
        <animate attributeName="stroke-dashoffset" from="320" to="0" dur="2.2s" begin="0.3s" fill="freeze"/>
      </polyline>
      <circle cx="952" cy="24" r="3.5" fill="#2dd4bf" stroke="none" opacity="0">
        <animate attributeName="opacity" values="0;1;0.3;1" dur="3s" begin="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect x="0.5" y="0.5" width="999" height="91" rx="10" fill="none" stroke="#2dd4bf" stroke-opacity="0.20"/>
  </g>
</svg>
