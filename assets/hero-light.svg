<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-label="Mayank Ghadia — Machine Learning, Computer Vision, Applied ML Systems">
  <title>Mayank Ghadia — Machine Learning, Computer Vision, Applied ML Systems</title>
  <defs>
    <linearGradient id="bg-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6fbfb"/>
      <stop offset="55%" stop-color="#e6f4f2"/>
      <stop offset="100%" stop-color="#d6ece9"/>
    </linearGradient>
    <linearGradient id="scanGrad-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#14b8a6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ruleGrad-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="dots-light" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#0f766e" fill-opacity="0.14"/>
    </pattern>
    <clipPath id="frame-light"><rect width="1000" height="270" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame-light)">
    <rect width="1000" height="270" fill="url(#bg-light)"/>
    <rect width="1000" height="270" fill="url(#dots-light)"/>

    <!-- segmentation contours that trace themselves, right side -->
    <g fill="none" stroke="#0d9488" stroke-width="1.6" stroke-linecap="round" opacity="0.55">
      <path d="M700 74 C 762 42, 856 56, 892 104 C 926 150, 900 206, 840 218 C 776 231, 714 202, 700 156 C 690 124, 690 96, 700 74 Z"
            stroke-dasharray="900" stroke-dashoffset="900">
        <animate attributeName="stroke-dashoffset" from="900" to="0" dur="3.2s" begin="0.2s" fill="freeze"/>
        <animate attributeName="opacity" values="0.75;0.4;0.75" dur="5s" begin="3.4s" repeatCount="indefinite"/>
      </path>
      <path d="M742 116 C 776 96, 838 102, 856 136 C 872 168, 848 196, 810 198 C 772 200, 742 178, 738 152 C 736 138, 736 126, 742 116 Z"
            stroke-dasharray="620" stroke-dashoffset="620" opacity="0.7">
        <animate attributeName="stroke-dashoffset" from="620" to="0" dur="2.6s" begin="0.9s" fill="freeze"/>
      </path>
      <circle cx="800" cy="150" r="4" fill="#0d9488" stroke="none" opacity="0">
        <animate attributeName="opacity" values="0;1;0.35;1" dur="4s" begin="3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- sweeping scanline -->
    <g>
      <rect x="-260" y="0" width="260" height="270" fill="url(#scanGrad-light)">
        <animate attributeName="x" from="-260" to="1000" dur="6.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="-260" y="0" width="1.5" height="270" fill="#14b8a6" opacity="0.5">
        <animate attributeName="x" from="-130" to="1130" dur="6.5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- name + rule + tagline -->
    <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="60" y="106" fill="#08282b" font-size="52" font-weight="700" letter-spacing="-1.2">Mayank Ghadia</text>

      <rect x="62" y="126" width="0" height="3" rx="1.5" fill="url(#ruleGrad-light)">
        <animate attributeName="width" from="0" to="330" dur="1.1s" begin="0.35s" fill="freeze"/>
      </rect>

      <text x="62" y="164" fill="#0f766e" font-size="17.5" font-weight="500" opacity="0">
        Machine Learning · Computer Vision · Applied ML Systems
        <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.8s" fill="freeze"/>
      </text>

      <text x="62" y="192" fill="#4b7a80" font-size="13.5"
            font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" opacity="0">
        CS senior @ Arizona State University · graduating Dec 2027
        <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.1s" fill="freeze"/>
      </text>
    </g>

    <!-- focus pills -->
    <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5">
      <g opacity="0">
        <rect x="62" y="216" width="90.4" height="28" rx="14" fill="#ffffff" stroke="#a7d5cf"/>
        <text x="73" y="234.5" fill="#0f766e">real data</text>
        <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.35s" fill="freeze"/>
      </g>
      <g opacity="0">
        <rect x="162.39999999999998" y="216" width="120.8" height="28" rx="14" fill="#ffffff" stroke="#a7d5cf"/>
        <text x="173.39999999999998" y="234.5" fill="#0f766e">held-out eval</text>
        <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.53s" fill="freeze"/>
      </g>
      <g opacity="0">
        <rect x="293.2" y="216" width="98.0" height="28" rx="14" fill="#ffffff" stroke="#a7d5cf"/>
        <text x="304.2" y="234.5" fill="#0f766e">tests + CI</text>
        <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.71s" fill="freeze"/>
      </g>
    </g>

    <rect x="0.5" y="0.5" width="999" height="269" rx="14" fill="none" stroke="#0d9488" stroke-opacity="0.22"/>
  </g>
</svg>
