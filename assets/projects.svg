    <g fill="#c89b45">
      <circle cx="0" r="4"/><circle cx="99" r="4"/><circle cx="198" r="4"/><circle cx="297" r="4"/>
      <circle cx="396" r="4"/><circle cx="495" r="4"/><circle cx="594" r="4"/><circle cx="693" r="4"/>
      <circle cx="792" r="4"/><circle cx="891" r="4"/><circle cx="990" r="4"/><circle cx="1088" r="4"/>
    </g>
  </g>
</svg>
