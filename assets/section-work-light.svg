<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="92" viewBox="0 0 1000 92" role="img" aria-label="02 — SELECTED WORK">
  <title>02 — SELECTED WORK</title>
  <defs>
    <linearGradient id="bg-work-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6f4f2"/>
      <stop offset="100%" stop-color="#f6fbfb"/>
    </linearGradient>
    <linearGradient id="sheen-work-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#14b8a6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots-work-light" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#0f766e" fill-opacity="0.14"/>
    </pattern>
    <clipPath id="frame-work-light"><rect width="1000" height="92" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#frame-work-light)">
    <rect width="1000" height="92" fill="url(#bg-work-light)"/>
    <rect width="1000" height="92" fill="url(#dots-work-light)"/>

    <rect x="-200" y="0" width="200" height="92" fill="url(#sheen-work-light)">
      <animate attributeName="x" from="-200" to="1000" dur="7s" repeatCount="indefinite"/>
    </rect>

    <rect x="0" y="0" width="4" height="92" fill="#0d9488"/>

    <text x="30" y="64" fill="#0d9488" fill-opacity="0.18" font-size="44" font-weight="700"
          font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">02</text>

    <text x="100" y="55" fill="#08282b" font-size="21" font-weight="700" letter-spacing="3.4"
          font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">SELECTED WORK</text>

    <text x="101" y="72" fill="#4b7a80" font-size="11" letter-spacing="0.6"
          font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">the four i can defend line by line</text>

    <g>
      <rect x="838" y="22" width="40" height="22" rx="4" fill="#ffffff" stroke="#a7d5cf"/>
      <rect x="838" y="22" width="40" height="22" rx="4" fill="#0d9488" opacity="0">
        <animate attributeName="opacity" values="0;0.5;0" dur="4.4s" begin="0.0s" repeatCount="indefinite"/>
      </rect>
      <rect x="886" y="22" width="40" height="22" rx="4" fill="#ffffff" stroke="#a7d5cf"/>
      <rect x="886" y="22" width="40" height="22" rx="4" fill="#0d9488" opacity="0">
        <animate attributeName="opacity" values="0;0.5;0" dur="4.4s" begin="1.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="838" y="50" width="40" height="22" rx="4" fill="#ffffff" stroke="#a7d5cf"/>
      <rect x="838" y="50" width="40" height="22" rx="4" fill="#0d9488" opacity="0">
        <animate attributeName="opacity" values="0;0.5;0" dur="4.4s" begin="2.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="886" y="50" width="40" height="22" rx="4" fill="#ffffff" stroke="#a7d5cf"/>
      <rect x="886" y="50" width="40" height="22" rx="4" fill="#0d9488" opacity="0">
        <animate attributeName="opacity" values="0;0.5;0" dur="4.4s" begin="3.3000000000000003s" repeatCount="indefinite"/>
      </rect>
    </g>

    <rect x="0.5" y="0.5" width="999" height="91" rx="10" fill="none" stroke="#0d9488" stroke-opacity="0.20"/>
  </g>
</svg>
