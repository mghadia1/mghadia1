<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="92" viewBox="0 0 1000 92" role="img" aria-label="04 — TOOLKIT">
  <title>04 — TOOLKIT</title>
  <defs>
    <linearGradient id="bg-toolkit-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0b1f26"/>
      <stop offset="100%" stop-color="#050b12"/>
    </linearGradient>
    <linearGradient id="sheen-toolkit-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5eead4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots-toolkit-dark" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#2dd4bf" fill-opacity="0.10"/>
    </pattern>
    <clipPath id="frame-toolkit-dark"><rect width="1000" height="92" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#frame-toolkit-dark)">
    <rect width="1000" height="92" fill="url(#bg-toolkit-dark)"/>
    <rect width="1000" height="92" fill="url(#dots-toolkit-dark)"/>

    <rect x="-200" y="0" width="200" height="92" fill="url(#sheen-toolkit-dark)">
      <animate attributeName="x" from="-200" to="1000" dur="7s" repeatCount="indefinite"/>
    </rect>

    <rect x="0" y="0" width="4" height="92" fill="#2dd4bf"/>

    <text x="30" y="64" fill="#2dd4bf" fill-opacity="0.18" font-size="44" font-weight="700"
          font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">04</text>

    <text x="100" y="55" fill="#eaf6f4" font-size="21" font-weight="700" letter-spacing="3.4"
          font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">TOOLKIT</text>

    <text x="101" y="72" fill="#6f9aa3" font-size="11" letter-spacing="0.6"
          font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">what i actually reach for</text>

    <g>
      <rect x="846" y="30" width="0" height="6" rx="3" fill="#2dd4bf" fill-opacity="0.75">
        <animate attributeName="width" from="0" to="104" dur="1s" begin="0.2s" fill="freeze"/>
      </rect>
      <rect x="846" y="43" width="0" height="6" rx="3" fill="#2dd4bf" fill-opacity="0.55">
        <animate attributeName="width" from="0" to="74" dur="1s" begin="0.38s" fill="freeze"/>
      </rect>
      <rect x="846" y="56" width="0" height="6" rx="3" fill="#2dd4bf" fill-opacity="0.35">
        <animate attributeName="width" from="0" to="92" dur="1s" begin="0.56s" fill="freeze"/>
      </rect>
    </g>

    <rect x="0.5" y="0.5" width="999" height="91" rx="10" fill="none" stroke="#2dd4bf" stroke-opacity="0.20"/>
  </g>
</svg>
