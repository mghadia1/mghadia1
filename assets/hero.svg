  </g>
  <g font-family="Arial, Helvetica, sans-serif" letter-spacing="0">
    <text x="56" y="46" fill="#c89b45" font-size="13">M GHADIA / PORTFOLIO INDEX 001</text>
    <text x="56" y="82" fill="#9f978e" font-size="14">COMPUTER SCIENCE SENIOR  ·  MEDICAL AI  ·  ROBOTICS  ·  ML</text>
  </g>
