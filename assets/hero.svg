    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a51f24" stop-opacity=".38"/>
      <stop offset="1" stop-color="#a51f24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="390" fill="#0a0908"/>
  <rect width="1200" height="390" fill="url(#grid)"/>
  <circle cx="1000" cy="198" r="210" fill="url(#glow)"/>
  <g fill="none" stroke="#c89b45" transform="translate(1000 198)">
