  <path d="M56 354H706" stroke="#a51f24" stroke-width="3"/>
  <text x="56" y="376" fill="#9f978e" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="0">REAL DATA  ·  HELD-OUT EVALUATION  ·  REPRODUCIBLE WORK</text>
